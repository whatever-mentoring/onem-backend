spring:
  application:
    name: onem-backend-test

  # TestContainers로 관리되는 데이터소스 설정
  datasource:
    primary:
      # TestContainers에서 자동으로 구성되므로 일부 속성만 설정
      driver-class-name: org.postgresql.Driver
    replica:
      # 테스트에서는 replica를 사용하지 않음
      url: ${spring.datasource.primary.url}
      username: ${spring.datasource.primary.username}
      password: ${spring.datasource.primary.password}
      driver-class-name: org.postgresql.Driver

  # 테스트 환경에서는 트레이싱 비활성화
  zipkin:
    enabled: false

# 액츄에이터 설정 간소화
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    enabled: false

# 로깅 레벨 조정
logging:
  level:
    root: WARN
    community.whatever.onembackendjava: DEBUG
    org.springframework.test: INFO
    org.springframework.jdbc.core: DEBUG
    org.testcontainers: INFO
