services:
  # PostgreSQL Master
  postgres-master:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onem
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
    networks:
      - onem-network
    command: 
      - "postgres"
      - "-c" 
      - "wal_level=logical"
      - "-c" 
      - "max_wal_senders=10"
      - "-c" 
      - "max_replication_slots=10"
      - "-c" 
      - "hot_standby=on"
      - "-c"
      - "listen_addresses=*"

  # PostgreSQL Replica
  postgres-replica:
    image: bitnami/postgresql:15
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: postgres
      POSTGRESQL_REPLICATION_PASSWORD: postgres
      POSTGRESQL_MASTER_PORT: 5432
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_DATABASE: onem
    networks:
      - onem-network
    depends_on:
      - postgres-master

  # Zipkin - 분산 트레이싱
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - onem-network

  # Prometheus - 메트릭 수집
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - onem-network
    # Prometheus는 독립적으로 실행

  # Grafana - 시각화 대시보드
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      # CORS 및 임베딩 허용 설정
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # CORS 설정
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=debug
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - onem-network
    depends_on:
      - prometheus

  # 애플리케이션 컨테이너 
  onem-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - onem-network
    depends_on:
      - postgres-master
      - postgres-replica
      - zipkin

networks:
  onem-network:
    driver: bridge

volumes:
  grafana-storage:
  postgres-master-data:
