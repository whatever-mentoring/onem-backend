spring:
  application:
    name: onem-backend
  profiles:
    active: dev
server:
  tomcat:
    mbeanregistry:
      enabled: true
  forward-headers-strategy: native
  address: 0.0.0.0



management:
  info:
    java:
      enabled: true
    os:
      enabled: true
  server:
    port: 8080 #편의를 위해
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-components: always
      show-details: always


--- #dev
spring.config.activate.on-profile: dev
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


logging.level.org.springframework.jdbc: debug


--- #stg
spring.config.activate.on-profile: stg
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver



--- #prod
spring.config.activate.on-profile: prd
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver




