spring:
  application:
    name: onem-backend

  # PostgreSQL 설정
  datasource:
    primary:
      url: jdbc:postgresql://34.47.88.149:5432/postgres
      driver-class-name: org.postgresql.Driver
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    replica:
      url: jdbc:postgresql://34.64.87.171:5432/postgres
      driver-class-name: org.postgresql.Driver
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  # Zipkin 트레이싱 설정
  zipkin:
    sender:
      type: web
    base-url: http://localhost:9411
    service:
      name: ${spring.application.name}

# 액츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# 로깅 설정
logging:
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight{%-5level} [%blue{%t}] %yellow{%C{1.}} : %msg%n%throwable'
  level:
    root: INFO
    community.whatever.onembackendjava: DEBUG
    community.whatever.onembackendjava.config.RequestLogger: INFO
    org.springframework.web: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.jdbc.core: DEBUG
  file:
    name: logs/onem-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    primary:
      url: jdbc:postgresql://postgres-master:5432/onem
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres
    replica:
      url: jdbc:postgresql://postgres-replica:5432/onem
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres
  zipkin:
    base-url: http://zipkin:9411
