global:
  scrape_interval: 20s
  scrape_timeout: 15s
  evaluation_interval: 1m

  external_labels:
    monitor: 'local'

scrape_configs:

  - job_name: "my-app-actuator"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s

    static_configs:
      - targets: [ "host.docker.internal:8080" ]