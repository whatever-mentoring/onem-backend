version: '3.8'

networks:
  monitoring:


services:
  prometheus:
    networks:
      - monitoring
    image: prom/prometheus:v3.2.1
    volumes:
      - ./docker_monitoring/prometheus/:/etc/prometheus/
    ports:
      - 9090:9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:9.3.8
    networks:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./docker_monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./docker_monitoring/grafana/plugins:/plugins